<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="PDF 원본 페이지로 구성한 병원 인증교육 플레이어">
  <meta name="robots" content="noindex, nofollow">
  <title>병원 인증교육</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      --canvas: #f6f8fb;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --stage: #eef2f7;
      --text: #1f2937;
      --muted: #667085;
      --border: #dde4ee;
      --border-strong: #afc8f5;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --required: #c4322c;
      --required-soft: #fff1f0;
      --complete: #0f766e;
      --shadow: 0 4px 16px rgba(15, 23, 42, .06);
      --page-shadow: 0 8px 28px rgba(15, 23, 42, .16);
      --radius: 14px;
      --header-h: 68px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--canvas);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, "Segoe UI", "Malgun Gothic", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      word-break: keep-all;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible {
      outline: 0;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .24);
    }
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .app-header {
      position: sticky;
      z-index: 50;
      top: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .97);
      backdrop-filter: blur(12px);
    }
    .header-inner {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(280px, 480px) minmax(120px, 1fr);
      align-items: center;
      gap: 24px;
      width: min(1440px, calc(100% - 40px));
      min-height: var(--header-h);
      margin: 0 auto;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      width: fit-content;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 750;
      letter-spacing: -.025em;
    }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1;
    }
    .header-meta {
      justify-self: end;
      color: var(--muted);
      font-size: .83rem;
      white-space: nowrap;
    }

    .search {
      position: relative;
    }
    .search-field {
      position: relative;
    }
    .search-symbol {
      position: absolute;
      z-index: 1;
      left: 14px;
      top: 50%;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }
    #search-input {
      width: 100%;
      height: 42px;
      padding: 0 70px 0 40px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: 0;
      background: var(--surface-subtle);
      color: var(--text);
    }
    #search-input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .14);
    }
    .search-shortcut {
      position: absolute;
      right: 12px;
      top: 50%;
      color: #8a94a4;
      font-size: .75rem;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .search-results {
      position: absolute;
      z-index: 80;
      right: 0;
      left: 0;
      top: calc(100% + 8px);
      max-height: min(500px, calc(100vh - 100px));
      overflow: auto;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 18px 42px rgba(15, 23, 42, .14);
    }
    .search-result {
      display: block;
      width: 100%;
      min-height: 58px;
      padding: 9px 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .search-result:hover,
    .search-result:focus-visible { background: var(--primary-soft); }
    .search-result strong {
      display: block;
      color: var(--text);
      font-size: .91rem;
      font-weight: 700;
    }
    .search-result small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: .78rem;
    }
    .search-empty {
      padding: 20px 12px;
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
    }

    main { min-height: calc(100vh - var(--header-h)); }
    .view { display: none; }
    .view.active { display: block; }

    .home {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 54px 0 72px;
    }
    .home-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }
    .home-kicker {
      margin: 0 0 4px;
      color: var(--primary);
      font-size: .8rem;
      font-weight: 750;
      letter-spacing: .09em;
    }
    .home h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.25rem);
      line-height: 1.25;
      letter-spacing: -.04em;
    }
    .source-total {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: .88rem;
      white-space: nowrap;
    }
    .lesson-list {
      display: grid;
      gap: 12px;
    }
    .lesson {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
      min-height: 104px;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .lesson:hover {
      border-color: var(--border-strong);
      box-shadow: 0 8px 24px rgba(37, 99, 235, .09);
      transform: translateY(-1px);
    }
    .lesson:active { transform: none; }
    .lesson.required { border-color: #c9dafb; }
    .lesson-number {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border-radius: 13px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .lesson-title-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .lesson h2 {
      margin: 0;
      font-size: 1.22rem;
      line-height: 1.35;
      letter-spacing: -.025em;
    }
    .required-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--required-soft);
      color: var(--required);
      font-size: .72rem;
      font-weight: 750;
    }
    .lesson-meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }
    .lesson-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 84px;
      justify-content: flex-end;
      color: var(--primary);
      font-size: .88rem;
      font-weight: 750;
    }
    .lesson-action .arrow { font-size: 1.2rem; }
    .home-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 2px 0;
      color: var(--muted);
      font-size: .82rem;
    }
    .home-note::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--complete);
      content: "";
    }

    .player {
      width: min(1500px, calc(100% - 40px));
      margin: 0 auto;
      padding: 16px 0 28px;
    }
    .breadcrumb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 44px;
      margin-bottom: 12px;
    }
    .breadcrumb {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: .86rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .breadcrumb strong { color: var(--text); font-weight: 700; }
    .breadcrumb-divider { margin: 0 7px; color: #a4adba; }
    .toc-toggle {
      display: none;
      min-height: 40px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }
    .player-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      align-items: start;
      gap: 20px;
    }

    .toc-panel {
      position: sticky;
      top: calc(var(--header-h) + 16px);
      height: calc(100vh - var(--header-h) - 34px);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      scrollbar-width: thin;
    }
    .toc-header {
      position: sticky;
      z-index: 2;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .98);
    }
    .toc-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: -.02em;
    }
    .toc-close {
      display: none;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 8px;
      background: var(--surface-subtle);
      cursor: pointer;
    }
    .toc-nav { padding: 8px; }
    .toc-intro,
    .toc-chapter-jump,
    .toc-item {
      display: block;
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .toc-intro,
    .toc-chapter-jump {
      padding: 9px 10px;
      color: var(--text);
      font-weight: 700;
    }
    .toc-chapter {
      margin: 10px 0 4px;
      padding: 12px 10px 4px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .76rem;
      font-weight: 750;
      line-height: 1.35;
    }
    .toc-chapter:first-of-type { margin-top: 2px; border-top: 0; }
    .toc-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 7px;
      align-items: start;
      padding: 8px 10px 8px 13px;
      color: #4b5563;
      font-size: .84rem;
      line-height: 1.42;
    }
    .toc-code {
      color: var(--primary);
      font-weight: 750;
      white-space: nowrap;
    }
    .toc-intro:hover,
    .toc-chapter-jump:hover,
    .toc-item:hover { background: var(--surface-subtle); }
    .toc-intro[aria-current="page"],
    .toc-chapter-jump[aria-current="page"],
    .toc-item[aria-current="page"] {
      box-shadow: inset 3px 0 0 var(--primary);
      background: var(--primary-soft);
      color: var(--text);
      font-weight: 700;
    }
    .toc-back {
      display: flex;
      align-items: center;
      gap: 7px;
      width: calc(100% - 16px);
      min-height: 42px;
      margin: 4px 8px 12px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: var(--surface-subtle);
      color: var(--primary);
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .toc-overlay {
      position: fixed;
      z-index: 69;
      inset: 0;
      display: none;
      border: 0;
      background: rgba(15, 23, 42, .36);
    }

    .player-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .player-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 62px;
      padding: 10px 14px 10px 18px;
      border-bottom: 1px solid var(--border);
    }
    .page-heading {
      min-width: 0;
    }
    .page-heading h1 {
      margin: 0;
      overflow: hidden;
      font-size: 1.03rem;
      font-weight: 750;
      line-height: 1.4;
      letter-spacing: -.02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .page-heading p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .78rem;
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }
    .tool-button,
    .pdf-link {
      display: inline-flex;
      min-width: 42px;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #475467;
      text-decoration: none;
      cursor: pointer;
    }
    .tool-button:hover,
    .pdf-link:hover {
      border-color: var(--border);
      background: var(--surface-subtle);
      color: var(--primary);
    }
    .zoom-value {
      min-width: 50px;
      color: var(--muted);
      font-size: .8rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .pdf-link {
      margin-left: 4px;
      border-color: var(--border);
      font-size: .8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .page-stage {
      height: calc(100vh - 248px);
      min-height: 430px;
      overflow: auto;
      padding: 18px;
      background: var(--stage);
      scrollbar-width: thin;
      overscroll-behavior: contain;
    }
    .page-stage.loading::after {
      display: block;
      width: 34px;
      height: 34px;
      margin: 100px auto 0;
      border: 3px solid #d5deea;
      border-top-color: var(--primary);
      border-radius: 50%;
      content: "";
      animation: spin .7s linear infinite;
    }
    .stage-inner {
      min-width: 100%;
      min-height: 100%;
    }
    #page-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      background: white;
      box-shadow: var(--page-shadow);
    }
    .page-stage.loading #page-image { visibility: hidden; }
    .image-error {
      max-width: 520px;
      margin: 80px auto;
      padding: 18px;
      border: 1px solid #fecaca;
      border-radius: 10px;
      background: #fff7f7;
      color: #991b1b;
      text-align: center;
    }

    .player-controls {
      display: grid;
      grid-template-columns: minmax(110px, auto) minmax(180px, 1fr) minmax(110px, auto);
      align-items: center;
      gap: 18px;
      min-height: 68px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .page-nav {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }
    .page-nav:hover:not(:disabled) {
      border-color: var(--border-strong);
      background: var(--primary-soft);
      color: var(--primary);
    }
    .page-nav:disabled {
      color: #aab2bf;
      cursor: not-allowed;
    }
    .page-nav.next { justify-self: end; }
    .progress-block {
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .progress-label {
      color: var(--muted);
      font-size: .79rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5eaf1;
    }
    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width .18s ease;
    }
    .page-live { position: absolute; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1023px) {
      .header-inner {
        grid-template-columns: minmax(210px, 1fr) minmax(260px, 460px);
      }
      .header-meta { display: none; }
      .player-layout { grid-template-columns: 1fr; }
      .toc-toggle { display: inline-flex; align-items: center; gap: 7px; }
      .toc-panel {
        position: fixed;
        z-index: 70;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(360px, calc(100% - 44px));
        height: 100vh;
        border-radius: 0 16px 16px 0;
        transform: translateX(-105%);
        transition: transform .2s ease;
      }
      .toc-close { display: inline-grid; place-items: center; }
      body.toc-open { overflow: hidden; }
      body.toc-open .toc-panel { transform: translateX(0); }
      body.toc-open .toc-overlay { display: block; }
      .page-stage { height: calc(100vh - 252px); }
    }

    @media (max-width: 767px) {
      :root { --header-h: 116px; }
      .header-inner {
        grid-template-columns: 1fr;
        gap: 8px;
        width: min(100% - 24px, 1440px);
        padding: 10px 0 11px;
      }
      .brand { min-height: 36px; }
      .brand-mark { width: 32px; height: 32px; }
      #search-input { height: 40px; padding-right: 44px; font-size: 16px; }
      .search-shortcut { display: none; }
      .home { width: min(100% - 24px, 1180px); padding: 34px 0 54px; }
      .home-heading { align-items: start; margin-bottom: 18px; }
      .source-total { display: none; }
      .lesson {
        grid-template-columns: 48px minmax(0, 1fr) auto;
        gap: 12px;
        min-height: 88px;
        padding: 14px;
      }
      .lesson-number { width: 44px; height: 44px; border-radius: 11px; }
      .lesson h2 { font-size: 1.05rem; }
      .lesson-meta { font-size: .78rem; }
      .lesson-action { min-width: auto; }
      .lesson-action-text { display: none; }
      .player { width: 100%; padding: 0; }
      .breadcrumb-bar {
        min-height: 48px;
        margin: 0;
        padding: 5px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .breadcrumb { font-size: .78rem; }
      .player-card { border: 0; border-radius: 0; box-shadow: none; }
      .player-toolbar {
        min-height: 58px;
        padding: 8px 10px 8px 12px;
      }
      .page-heading h1 { font-size: .94rem; }
      .page-heading p { font-size: .72rem; }
      .toolbar-actions { gap: 0; }
      .tool-button { min-width: 40px; min-height: 40px; padding: 6px 8px; }
      .zoom-value, .fit-button, .pdf-link { display: none; }
      .page-stage {
        height: auto;
        min-height: 0;
        max-height: none;
        padding: 8px;
        overflow: auto;
      }
      .stage-inner { min-height: 0; }
      .player-controls {
        position: sticky;
        z-index: 35;
        bottom: 0;
        grid-template-columns: auto minmax(100px, 1fr) auto;
        gap: 9px;
        min-height: 64px;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        box-shadow: 0 -5px 18px rgba(15, 23, 42, .08);
      }
      .page-nav { min-width: 44px; padding: 8px 11px; }
      .progress-label { font-size: .73rem; }
    }

    @media (max-width: 360px) {
      .page-nav-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
      .lesson { grid-template-columns: 44px minmax(0, 1fr) auto; }
      .required-badge { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media print {
      .app-header, .breadcrumb-bar, .toc-panel, .player-toolbar, .player-controls { display: none !important; }
      body, .player, .player-card, .page-stage { width: 100%; margin: 0; padding: 0; border: 0; background: white; box-shadow: none; }
      .page-stage { height: auto; overflow: visible; }
      #page-image { width: 100% !important; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#home" data-home>
        <span class="brand-mark" aria-hidden="true">＋</span>
        <span>병원 인증교육</span>
      </a>

    function createElement(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function pageFile(page) {
      return "assets/pages/page-" + String(page).padStart(3, "0") + ".jpg";
    }

    function getProgress() {
      try {
        var value = JSON.parse(localStorage.getItem(progressKey) || "{}");
        return value && typeof value === "object" ? value : {};
      } catch (error) {
        return {};
      }
    }

    function saveProgress(groupId, page) {
      var progress = getProgress();
      progress[groupId] = page;
      try {
        localStorage.setItem(progressKey, JSON.stringify(progress));
      } catch (error) {
        return;
      }
      updateHomeActions();
    }

    function updateHomeActions() {
      var progress = getProgress();
      document.querySelectorAll("[data-open-group]").forEach(function (link) {
        var group = GROUPS[link.dataset.openGroup];
        var label = link.querySelector(".lesson-action-text");
        var savedPage = Number(progress[group.id]);
        label.textContent = savedPage >= group.start && savedPage <= group.end && savedPage !== group.start ? "이어보기" : "열기";
      });
    }

    function getEntries(group) {
      var entries = [];
      if (group.introPages && group.introPages.length) {
        entries.push({
          kind: "intro",
          code: "",
          title: group.introTitle || group.label,
          chapter: "",
          start: group.introPages[0],
          end: group.introPages[group.introPages.length - 1]
        });
      }
      group.chapters.forEach(function (chapter) {
        if (chapter.introPages && chapter.introPages.length) {
          entries.push({
            kind: "chapter",
            code: "",
            title: chapter.title,
            chapter: chapter.title,
            start: chapter.introPages[0],
            end: chapter.introPages[chapter.introPages.length - 1]
          });
        }
        chapter.items.forEach(function (item) {
          entries.push({
            kind: "item",
            code: item[0],
            title: item[1],
            chapter: chapter.title,
            start: item[2],
            end: item[3]
          });
        });
      });
      return entries;
    }

    function findEntry(group, page) {
      var entries = getEntries(group);
      for (var index = 0; index < entries.length; index += 1) {
        if (page >= entries[index].start && page <= entries[index].end) return entries[index];
      }
      return {
        kind: "page",
        code: "",
        title: group.label,
        chapter: "",
        start: page,
        end: page
      };
    }

    function itemLabel(entry) {
      return (entry.code ? entry.code + " " : "") + entry.title;
    }

    function renderToc(group) {
      tocNav.replaceChildren();
      tocTitle.textContent = group.label;

      if (group.introPages && group.introPages.length) {
        var intro = createElement("button", "toc-intro", group.introTitle || group.label);
        intro.type = "button";
        intro.dataset.page = String(group.introPages[0]);
        intro.dataset.start = String(group.introPages[0]);
        intro.dataset.end = String(group.introPages[group.introPages.length - 1]);
        tocNav.appendChild(intro);
      }

      group.chapters.forEach(function (chapter) {
        var chapterLabel = createElement("div", "toc-chapter", chapter.title);
        tocNav.appendChild(chapterLabel);

        if (chapter.introPages && chapter.introPages.length) {
          var chapterJump = createElement("button", "toc-chapter-jump", "장 도입");
          chapterJump.type = "button";
          chapterJump.dataset.page = String(chapter.introPages[0]);
          chapterJump.dataset.start = String(chapter.introPages[0]);
          chapterJump.dataset.end = String(chapter.introPages[chapter.introPages.length - 1]);
          tocNav.appendChild(chapterJump);
        }

        chapter.items.forEach(function (item) {
          var button = createElement("button", "toc-item");
          var code = createElement("span", "toc-code", item[0] || String(item[2]).padStart(2, "0"));
          var title = createElement("span", "", item[1]);
          button.type = "button";
          button.dataset.page = String(item[2]);
          button.dataset.start = String(item[2]);
          button.dataset.end = String(item[3]);
          button.append(code, title);
          tocNav.appendChild(button);
        });
      });
    }

    function updateTocCurrent() {
      var current = null;
      tocNav.querySelectorAll("[data-page]").forEach(function (button) {
        var active = state.page >= Number(button.dataset.start) && state.page <= Number(button.dataset.end);
        if (active) {
          button.setAttribute("aria-current", "page");
          current = button;
        } else {
          button.removeAttribute("aria-current");
        }
      });
      if (current) current.scrollIntoView({ block: "nearest" });
    }

    function openToc() {
      document.body.classList.add("toc-open");
      tocToggle.setAttribute("aria-expanded", "true");
      setTimeout(function () {
        var current = tocNav.querySelector('[aria-current="page"]');
        if (current) current.scrollIntoView({ block: "center" });
        tocClose.focus();
      }, 40);
    }

    function closeToc(returnFocus) {
      document.body.classList.remove("toc-open");
      tocToggle.setAttribute("aria-expanded", "false");
      if (returnFocus) tocToggle.focus();
    }

    function setZoom(nextZoom) {
      state.zoom = clamp(nextZoom, 80, 160);
      pageImage.style.width = state.zoom + "%";
      zoomValue.textContent = state.zoom + "%";
      if (state.zoom === 100) {
        pageStage.scrollLeft = 0;
        pageStage.scrollTop = 0;
      }
    }

    function preloadAdjacent(group) {
      [state.page - 1, state.page + 1].forEach(function (page) {
        if (page >= group.start && page <= group.end) {
          var preload = new Image();
          preload.src = pageFile(page);
        }
      });
    }

    function renderPage(groupId, page) {
      var group = GROUPS[groupId];
      if (!group) {
        renderHome();
        return;
      }

      state.groupId = groupId;
      state.page = clamp(Number(page) || group.start, group.start, group.end);
      state.zoom = 100;

      homeView.classList.remove("active");
      playerView.classList.add("active");

      if (state.lastGroupId !== groupId) {
        renderToc(group);
        state.lastGroupId = groupId;
      }

      var entry = findEntry(group, state.page);
      var label = itemLabel(entry);
      var position = state.page - group.start + 1;
      var total = group.end - group.start + 1;
      var percent = total === 1 ? 100 : ((position - 1) / (total - 1)) * 100;

      breadcrumb.replaceChildren();
      var groupStrong = createElement("strong", "", group.label);
      breadcrumb.appendChild(groupStrong);
      if (entry.chapter && entry.chapter !== entry.title) {
        breadcrumb.appendChild(createElement("span", "breadcrumb-divider", "/"));
        breadcrumb.appendChild(document.createTextNode(entry.chapter));
      }
      breadcrumb.appendChild(createElement("span", "breadcrumb-divider", "/"));
      breadcrumb.appendChild(document.createTextNode(label));
      breadcrumb.appendChild(createElement("span", "breadcrumb-divider", "/"));
      breadcrumb.appendChild(document.createTextNode("원문 " + state.page + "쪽"));

      pageTitle.textContent = label;
      pageSubtitle.textContent = "PDF 원본 " + state.page + "쪽 · " + group.label;
      progressLabel.textContent = position + " / " + total + " · 원문 " + state.page + "쪽";
      progressBar.style.width = percent + "%";
      progressTrack.setAttribute("aria-valuenow", String(position));
      progressTrack.setAttribute("aria-valuemax", String(total));

      previousPage.disabled = state.page <= group.start;
      nextPage.disabled = state.page >= group.end;

      imageError.hidden = true;
      pageImage.hidden = false;
      pageStage.classList.add("loading");
      pageImage.alt = "원문 " + state.page + "쪽: " + label;
      pageImage.src = pageFile(state.page);
      setZoom(100);
      updateTocCurrent();
      saveProgress(groupId, state.page);
      preloadAdjacent(group);
      pageLive.textContent = label + ", 원문 " + state.page + "쪽";
      document.title = label + " · 병원 인증교육";
      closeToc(false);
    }

    function renderHome() {
      playerView.classList.remove("active");
      homeView.classList.add("active");
      state.groupId = "";
      document.title = "병원 인증교육";
      closeToc(false);
      closeSearch();
      updateHomeActions();
      window.scrollTo(0, 0);
    }

    function navigateTo(groupId, page) {
      location.hash = "#player/" + groupId + "/" + page;
    }

    function openGroup(groupId) {
      var group = GROUPS[groupId];
      var progress = getProgress();
      var savedPage = Number(progress[groupId]);
      var page = savedPage >= group.start && savedPage <= group.end ? savedPage : group.start;
      navigateTo(groupId, page);
    }

    function applyHash() {
      var raw = location.hash.replace(/^#/, "");
      if (!raw || raw === "home") {
        renderHome();
        return;
      }
      var parts = raw.split("/");
      if (parts[0] !== "player" || !GROUPS[parts[1]]) {
        renderHome();
        return;
      }
      renderPage(parts[1], Number(parts[2]));
    }

    function buildSearchIndex() {
      var index = [];
      Object.keys(GROUPS).forEach(function (groupId) {
        var group = GROUPS[groupId];
        getEntries(group).forEach(function (entry) {
          index.push({
            groupId: groupId,
            groupLabel: group.label,
            code: entry.code,
            title: entry.title,
            chapter: entry.chapter,
            start: entry.start,
            end: entry.end,
            searchable: ((entry.code || "") + " " + entry.title + " " + (entry.chapter || "") + " " + group.label).toLocaleLowerCase("ko")
          });
        });
      });
      return index;
    }

    var searchIndex = buildSearchIndex();

    function closeSearch() {
      searchResults.hidden = true;
      searchInput.setAttribute("aria-expanded", "false");
      searchStatus.textContent = "";
    }

    function runSearch() {
      var query = searchInput.value.trim().toLocaleLowerCase("ko");
      searchResults.replaceChildren();

      if (!query) {
        closeSearch();
        return;
      }

      var found = searchIndex.filter(function (entry) {
        return entry.searchable.includes(query);
      }).slice(0, 12);

      if (!found.length) {
        searchResults.appendChild(createElement("div", "search-empty", "검색 결과가 없습니다."));
      } else {
        found.forEach(function (entry) {
          var result = createElement("button", "search-result");
          var title = createElement("strong", "", (entry.code ? entry.code + " " : "") + entry.title);
          var pages = entry.start === entry.end ? entry.start + "쪽" : entry.start + "-" + entry.end + "쪽";
          var meta = createElement("small", "", entry.groupLabel + " · 원문 " + pages);
          result.type = "button";
          result.dataset.group = entry.groupId;
          result.dataset.page = String(entry.start);
          result.append(title, meta);
          searchResults.appendChild(result);
        });
      }

      searchResults.hidden = false;
      searchInput.setAttribute("aria-expanded", "true");
      searchStatus.textContent = found.length ? "검색 결과 " + found.length + "개" : "검색 결과가 없습니다.";
    }

    document.addEventListener("click", function (event) {
      var homeTarget = event.target.closest("[data-home]");
      if (homeTarget) {
        event.preventDefault();
        location.hash = "#home";
        return;
      }

      var groupTarget = event.target.closest("[data-open-group]");
      if (groupTarget) {
        event.preventDefault();
        openGroup(groupTarget.dataset.openGroup);
        return;
      }

      var tocTarget = event.target.closest("#toc-nav [data-page]");
      if (tocTarget) {
        navigateTo(state.groupId, Number(tocTarget.dataset.page));
        return;
      }

      var searchTarget = event.target.closest(".search-result");
      if (searchTarget) {
        navigateTo(searchTarget.dataset.group, Number(searchTarget.dataset.page));
        searchInput.value = "";
        closeSearch();
        return;
      }

      if (!event.target.closest(".search")) closeSearch();
    });

    pageImage.addEventListener("load", function () {
      pageStage.classList.remove("loading");
      imageError.hidden = true;
      pageImage.hidden = false;
    });

    pageImage.addEventListener("error", function () {
      pageStage.classList.remove("loading");
      pageImage.hidden = true;
      imageError.hidden = false;
    });

    previousPage.addEventListener("click", function () {
      if (state.groupId && !previousPage.disabled) navigateTo(state.groupId, state.page - 1);
    });

    nextPage.addEventListener("click", function () {
      if (state.groupId && !nextPage.disabled) navigateTo(state.groupId, state.page + 1);
    });

    document.getElementById("zoom-out").addEventListener("click", function () {
      setZoom(state.zoom - 10);
    });

    document.getElementById("zoom-in").addEventListener("click", function () {
      setZoom(state.zoom + 10);
    });

    document.getElementById("fit-page").addEventListener("click", function () {
      setZoom(100);
    });

    document.getElementById("fullscreen").addEventListener("click", function () {
      var target = document.getElementById("player-card");
      if (!document.fullscreenElement && target.requestFullscreen) {
        target.requestFullscreen();
      } else if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen();
      }
    });

    tocToggle.addEventListener("click", openToc);
    tocClose.addEventListener("click", function () { closeToc(true); });
    tocOverlay.addEventListener("click", function () { closeToc(true); });

    searchInput.addEventListener("input", runSearch);
    searchInput.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        searchInput.value = "";
        closeSearch();
        searchInput.blur();
      }
      if (event.key === "Enter") {
        var first = searchResults.querySelector(".search-result");
        if (first) first.click();
      }
    });

    document.addEventListener("keydown", function (event) {
      var target = event.target;
      var editing = target && (target.matches("input, textarea, select") || target.isContentEditable);

      if ((event.ctrlKey || event.metaKey) && event.key.toLocaleLowerCase() === "k") {
        event.preventDefault();
        searchInput.focus();
        searchInput.select();
        return;
      }

      if (editing || !state.groupId) return;

      if (event.key === "ArrowLeft" && !previousPage.disabled) {
        event.preventDefault();
        navigateTo(state.groupId, state.page - 1);
      } else if (event.key === "ArrowRight" && !nextPage.disabled) {
        event.preventDefault();
        navigateTo(state.groupId, state.page + 1);
      } else if (event.key === "Home") {
        event.preventDefault();
        navigateTo(state.groupId, GROUPS[state.groupId].start);
      } else if (event.key === "End") {
        event.preventDefault();
        navigateTo(state.groupId, GROUPS[state.groupId].end);
      } else if (event.key === "+" || event.key === "=") {
        event.preventDefault();
        setZoom(state.zoom + 10);
      } else if (event.key === "-") {
        event.preventDefault();
        setZoom(state.zoom - 10);
      } else if (event.key === "Escape") {
        closeToc(false);
      }
    });

    window.addEventListener("hashchange", applyHash);
    window.addEventListener("resize", function () {
      if (window.innerWidth >= 1024) closeToc(false);
    });

    updateHomeActions();
    applyHash();
  </script>
</body>
</html>
